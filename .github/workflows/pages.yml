# Manual / fallback deploy of the pages-site content branch.
# Normal publishes go through pages-content.yml (update + deploy).
# One-time: Settings → Pages → Source = GitHub Actions.
# Environments → github-pages → Deployment branches → All branches
# (needed so pull_request jobs in pages-content can deploy).
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pages-site
          lfs: false
      - name: Stage deploy tree
        run: |
          set -euo pipefail
          rm -rf _deploy
          mkdir _deploy
          tar -C . --exclude .git -cf - . | tar -C _deploy -xf -
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _deploy
          # .nojekyll is a dotfile. v4+ omits those unless this is set.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
