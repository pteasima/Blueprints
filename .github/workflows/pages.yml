# Deploy the pages-site content branch to GitHub Pages.
# Content is updated by pages-content.yml (main + PR previews).
# One-time: Settings → Pages → Source = GitHub Actions.
# Environments → github-pages → Deployment branches → allow pages-site (or All).
name: pages

on:
  push:
    branches: [pages-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-site
          # pages-site stores expanded binaries (not LFS pointers)
          lfs: false
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
