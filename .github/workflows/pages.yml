# Deploy docs/ to GitHub Pages (rolling URL — last push wins).
# One-time: Settings → Pages → Source = GitHub Actions.
name: pages

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "docs/**"
      - "src/blueprints/preview_hub.py"
      - "scripts/build-preview-hub.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Quick Look hub
        run: python scripts/build-preview-hub.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
