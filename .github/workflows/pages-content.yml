# Update the pages-site content branch and deploy GitHub Pages:
# - push to main → site root (keeps pr-preview/)
# - push to any other branch → pr-preview/pr-<N>/ for the open PR
# - PR open/sync/close → same preview publish, or delete on close
#
# Feature-branch pushes are the backup publish. Cursor app commits sometimes
# never emit pull_request, and the app token cannot workflow_dispatch (403).
# Deploy runs in this workflow.
name: pages-content

on:
  push:
    branches-ignore: [pages-site]
    paths:
      - "docs/**"
      - "src/blueprints/viewer/**"
      - "src/blueprints/preview_hub.py"
      - "scripts/build-preview-hub.py"
      - "scripts/merge_pages_site.py"
      - "scripts/checkout_pages_site.sh"
      - "scripts/push_pages_site.sh"
      - "src/blueprints/pages_site.py"
      - ".github/workflows/pages-content.yml"
  # No path filters on pull_request so closed always cleans up pr-preview/pr-<N>/.
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to republish or remove"
        required: false
        type: string
      action:
        description: "preview (default) or remove"
        required: false
        default: preview
        type: string

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: false

jobs:
  update:
    outputs:
      mode: ${{ steps.merge.outputs.mode }}
    runs-on: ubuntu-latest
    # Same-repo PRs only (fork tokens cannot push pages-site).
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A closed, unmerged PR only needs scripts (the head branch may be gone).
          # A merge must check out the merge commit: the main push is often
          # cancelled while this close run is the one that actually deploys.
          lfs: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed' && !github.event.pull_request.merged) }}
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build web-viewer hub
        if: >
          github.event_name != 'pull_request' ||
          github.event.action != 'closed' ||
          github.event.pull_request.merged
        run: python scripts/build-preview-hub.py

      - name: Checkout pages-site content branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/checkout_pages_site.sh pages-site

      - name: Merge into pages-site
        id: merge
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
          PR_MERGED: ${{ github.event.pull_request.merged && 'true' || 'false' }}
          DISPATCH_ACTION: ${{ inputs.action || 'preview' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh

          # A feature-branch push publishes that branch's open PR. Skip when
          # pull_request will publish the same commit, and never fall through
          # to the production root.
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            PR_NUMBER="$(
              gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --head "$GITHUB_REF_NAME" \
                --state open \
                --json number \
                --jq '.[0].number // empty'
            )"
            if [[ -z "${PR_NUMBER}" ]]; then
              echo "No open PR for ${GITHUB_REF_NAME}; not publishing"
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "pr=" >> "$GITHUB_OUTPUT"
              echo "message=Skip pages-site (no open PR)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
            pr_runs="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --commit "$GITHUB_SHA" \
                --workflow pages-content.yml \
                --event pull_request \
                --json databaseId \
                --jq 'length'
            )"
            if [[ "${pr_runs}" != "0" ]]; then
              echo "pull_request run already publishing ${GITHUB_SHA}"
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "pr=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "message=Skip pages-site (pull_request run exists)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          seed_root_from_main_if_needed() {
            if [[ -f pages-site/index.html ]]; then
              return 0
            fi
            echo "Seeding pages-site root from origin/main"
            git fetch --depth 1 origin main
            rm -rf _main_seed
            mkdir _main_seed
            git archive origin/main | tar -C _main_seed -xf -
            (cd _main_seed && python scripts/build-preview-hub.py)
            python scripts/merge_pages_site.py root _main_seed/docs pages-site
          }

          if [[ "$EVENT_NAME" == "pull_request" && "$EVENT_ACTION" == "closed" ]]; then
            python scripts/merge_pages_site.py remove pages-site "$PR_NUMBER"
            # GitHub cancels an older pending run in this concurrency group.
            # The main push at merge time is usually that older run, so this
            # close has to publish the production root or the live site stays stale.
            if [[ "$PR_MERGED" == "true" ]]; then
              python scripts/build-preview-hub.py
              seed_root_from_main_if_needed
              python scripts/merge_pages_site.py root docs pages-site
              echo "message=Publish production root and remove PR preview pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            else
              echo "message=Remove PR preview pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            fi
            echo "mode=remove" >> "$GITHUB_OUTPUT"
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            seed_root_from_main_if_needed
            python scripts/merge_pages_site.py preview docs pages-site "$PR_NUMBER"
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "message=Publish PR preview pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${PR_NUMBER}" ]]; then
            if [[ "$DISPATCH_ACTION" == "remove" ]]; then
              python scripts/merge_pages_site.py remove pages-site "$PR_NUMBER"
              echo "mode=remove" >> "$GITHUB_OUTPUT"
            else
              python scripts/build-preview-hub.py
              seed_root_from_main_if_needed
              python scripts/merge_pages_site.py preview docs pages-site "$PR_NUMBER"
              echo "mode=preview" >> "$GITHUB_OUTPUT"
            fi
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "message=Manual pages-site update pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            seed_root_from_main_if_needed
            python scripts/merge_pages_site.py preview docs pages-site "$PR_NUMBER"
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "message=Publish PR preview pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            python scripts/merge_pages_site.py root docs pages-site
            echo "mode=root" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "message=Publish production Pages root" >> "$GITHUB_OUTPUT"
          fi

      - name: Push pages-site
        if: steps.merge.outputs.mode != 'skip'
        run: bash scripts/push_pages_site.sh pages-site "${{ steps.merge.outputs.message }}"

      - name: Stage deploy tree
        if: steps.merge.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          rm -rf _deploy
          mkdir _deploy
          # Exclude .git from the Pages artifact.
          tar -C pages-site --exclude .git -cf - . | tar -C _deploy -xf -

      - uses: actions/configure-pages@v5
        if: steps.merge.outputs.mode != 'skip'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.merge.outputs.mode != 'skip'
        with:
          path: _deploy

      - name: Comment on PR
        if: steps.merge.outputs.pr != '' && steps.merge.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMENT_ACTION: ${{ steps.merge.outputs.mode == 'remove' && 'remove' || 'deploy' }}
        run: |
          bash scripts/comment_pr_preview.sh \
            "${{ steps.merge.outputs.pr }}" \
            "$COMMENT_ACTION"

  deploy:
    needs: update
    if: needs.update.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
