# Full pytest suite. Python 3.12 matches pages-content and the Cloud Agent image.
# `pip install -e ".[dev]"` installs pyproject deps (including ifcopenshell==0.8.5)
# and exposes the vendored package at vendor/yaml-ifc via setuptools.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            shared-mime-info

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest
