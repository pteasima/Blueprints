  <g font-family="sans-serif" font-size="6.0" fill="#1a2433">
    <text x="4790.0" y="-3462.0">Right eave: slope GKF bears on the soffit lid, no gap</text>
    <text x="4790.0" y="-3448.0">2x GKF 12.5 cut level, sits on the lid top</text>
    <text x="4790.0" y="-3434.0">NaturHeld 100 with a level toe on the lid; wool fills to the boards</text>
    <text x="5018.4" y="-3347.5">soffit CD + 40 deg UD (slope CDs slide in)</text>
    <text x="5018.4" y="-3333.5">LB 3.5x9.5 @ 300 mm</text>
    <text x="5130.0" y="-3315.5">Jutafol N AL 170 over the CD and lid</text>
    <text x="5130.0" y="-3257.5">soffit GKF lid</text>
    <text x="5220.0" y="-3150.0">brake: slack loop, then</text>
    <text x="5220.0" y="-3137.0">bonded + taped to cabinet plaster</text>
    <text x="5220.0" y="-3124.0">(inside the soffit void)</text>
  </g>
