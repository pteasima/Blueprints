  <g font-family="sans-serif" font-size="6.0" fill="#1a2433">
    <text x="4500.0" y="-2920.0">Lid widens until it meets the lowered slope</text>
    <text x="4500.0" y="-2902.0">slope GKF screws into the nearest slope CD</text>
    <text x="4500.0" y="-2884.0">angle on that CD holds a horizontal UD</text>
    <text x="4500.0" y="-2866.0">lid edge screws into that UD</text>
    <text x="4680.0" y="-2920.0">slope NaturHeld runs to the vertical soffit face</text>
    <text x="4680.0" y="-2902.0">wool triangle under the lid, one solid</text>
    <text x="4680.0" y="-2884.0">brake taped to the cabinet plaster</text>
  </g>
