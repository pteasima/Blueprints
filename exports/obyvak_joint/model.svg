  <g font-family="sans-serif" font-size="6.0" fill="#1a2433">
    <text x="4500.0" y="-2920.0">Lid widens until it meets the lowered slope</text>
    <text x="4500.0" y="-2902.0">floating joint, connection left open</text>
    <text x="4500.0" y="-2884.0">no angle and no UD on this edge</text>
    <text x="4500.0" y="-2866.0">bottom CD stays clear of the lid</text>
    <text x="4680.0" y="-2920.0">slope NaturHeld runs to the vertical soffit face</text>
    <text x="4680.0" y="-2902.0">wool triangle under the lid, one solid</text>
    <text x="4680.0" y="-2884.0">brake taped to the cabinet plaster</text>
    <text x="4500.0" y="-2848.0">StoSilent kout: 1. strana do koutu, nechat schnout</text>
    <text x="4500.0" y="-2830.0">2. páska Sto-Stuckband, přesah pár mm</text>
    <text x="4500.0" y="-2812.0">3. druhá strana přes pásku</text>
    <text x="4500.0" y="-2794.0">4. za čerstva řezat a pásku stáhnout</text>
  </g>
