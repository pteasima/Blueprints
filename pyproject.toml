[project]
name = "blueprints"
version = "0.1.0"
description = "Parametric 2D/3D house models (build123d) for the pteasima Blueprints workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "build123d>=0.13.0",
    "cairosvg>=2.9.1",
    "usd-core>=26.11",
    "openpyxl>=3.1.5",
    "PyYAML>=6.0.3",
    # yaml-ifc is vendored under vendor/yaml-ifc at 0f96c26. Upstream is
    # private, so that tree is not bumped here. shapely 2.2.0 is current
    # stable and what its tiling code imports. ifcopenshell tracks the
    # current stable wheel; the test suite is the check against that copy.
    "ifcopenshell==0.9.0.post1",
    "shapely==2.2.0",
    # Room-wave acoustics. Gmsh's wheel still needs libglu1-mesa on the system.
    "gmsh>=4.15.2",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
bp-export = "blueprints.cli:main"

[build-system]
requires = ["setuptools>=84.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "vendor/yaml-ifc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
blueprints = ["viewer/viewer.iife.js", "viewer/main.js", "viewer/package.json"]
