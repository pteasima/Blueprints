# Room 1.07 (Koupelna), the large bathroom: bathtub to the west, double
# washbasin under the north window, walk-in shower to the east.
# Lengths are metres. Storey coordinates, the same frame as ground-floor.yaml.
# Clear inner faces, after the radon chase moved into the neighbouring room:
#   west  x=9.725   (W-039 / W-040 inner face, the full depth)
#   east  x=14.225  (W-045 / W-046 inner face)
#   south y=10.15   (W-022 inner face)
#   north y=12.25   (W-026 inner face)
# Clear size 4.500 × 2.100 m. Model area 9.450 m².
# The ZTI room table (D.1.4.1.03) lists 8.91 m². These faces are the tiling
# boundary; the difference is not closed here.
# Clear height 2.500 m (legend s.v.).
# +X east, +Y north.
# Door OP17 is in the south wall, x=11.50–12.50, leaf height 2.100 m.
# The partition is 125 mm, so the floor stops on the inner face.
# Window OP15 is in the north wall, x=9.95–12.85, sill 1.750 m, head 2.500 m.
# The wall file has no window on the west wall.
# Tiles are ABK Poetry Stone, rectified, 8.5 mm:
#   floor outside the shower 596×596
#   shower floor cut to 600 mm in the fall direction; the east column is the
#   same 555 mm cut as the module hung from the east wall
#   walls 596×1194 portrait, two courses, bottom at height 0
# Wall joint 2 mm. Plan pitch on the level floor is 598 mm.
# Grid origin (13.67, 10.15) is the module boundary 555 mm west of the east
# wall, on the south wall. The glass stands on the next joint west, x=13.072.
# Shower clear width 1.153 m.
# The shower falls 1.25% from the south (the side opposite the drain, at the
# same 0 as the level floor) toward the north. The drain is a wall drain in
# the shower pre-wall, across the full shower width.
# KOV 3G110CM (kovshop): overall 1140×127 mm, grate length 1100 mm, grate
# width 35 mm, installation height 52 mm, depth 47 mm, outlet Ø40 mm.
# The catalog length is 13 mm short of the 1153 mm shower; the model spans
# the full clear width, as asked.
# Stainless edge profiles, 10 mm wide, follow the 1.25% fall on both sides
# of the shower floor (glass and east wall). Wall tiles start at height 0.
# They do not follow the fall.
# Washbasin pre-wall is 195 mm, just under 200 mm, so the Cersanit Zen 190
# (1900×900×450) fits against the south wall with 5 mm to spare.
# Shower pre-wall is 150 mm, enough for the 127 mm drain body.
# Niche: 596 mm wide, sill at 800 mm, top on the course joint at 1194 mm
# (394 mm high), centred on the shower pre-wall. Not a measured niche; it is
# lower than the previous upper course.
# Two 600×480 mm wall-hung basins, rim at 850 mm, centred on the window.
# No basin product was named.
# Glass: 8 mm, 2000 mm high, 700 mm walk-in opening at the south.
# Floor build-up at finished-floor zero, 250 mm:
#   waterproofing 8, EPS 100S 60+60, nop board 50, screed 59, adhesive+tile 13.
# The 8 mm membrane is what makes those layers add to 250.
# EPS under the shower stays 60+60. The screed at the drain is reported
# from the measured drop. It is not thickened.
# Screed, membrane, and ceiling are properties. They are not extruded.
# The tile solid is the 8.5 mm ceramic. The 13 mm finish is the build-up sum.
