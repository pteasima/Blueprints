# Room 1.07 (Koupelna), the large bathroom: bathtub side to the west, double
# washbasin under the north window, walk-in shower to the east.
# Lengths are metres. Storey coordinates, the same frame as ground-floor.yaml.
# Clear inner faces, from the wall footprints (drawing faces, not a site measure):
#   west  x=9.725   (W-039 inner face) up to y=12.05
#   west  x=9.9     (W-040 inner face) from y=12.05 to the north wall
#   east  x=14.225  (W-045 / W-046 inner face)
#   south y=10.15   (W-022 inner face)
#   north y=12.25   (W-026 inner face)
# Clear size 4.500 m east-west by 2.100 m north-south, less a 175×200 mm
# northwest jog where the west wall thickens. Model area 9.415 m².
# The ZTI room table (D.1.4.1.03) lists 8.91 m². These faces are the tiling
# boundary; the difference is not closed here.
# Clear height 2.500 m (legend s.v.).
# +X east, +Y north.
# Door OP17 is in the south wall, x=11.50–12.50, leaf height 2.100 m.
# The partition is 125 mm, so the floor stops on the inner face. It does not
# step into the reveal the way room 1.20 does (that leaf line needs 100 mm
# inside a 250 mm wall).
# Window OP15 is in the north wall, x=9.95–12.85, sill 1.750 m, head 2.500 m.
# The wall file has no window on the west wall. The SketchUp view shows a
# small light there; it is not an opening in this model.
# Tiles are ABK Poetry Stone, rectified, 8.5 mm, the same batch sizes as 1.20:
#   floor 596×596, walls 596×1194 portrait, two courses.
#   1194 = 2×596 + 2, so one wall tile's height spans two floor tiles and the
#   joint between them.
# Wall joint 2 mm, measured in plan. Plan pitch is 598 mm.
# The floor outside the shower is level at 0. Floor joints there are 2 mm.
# Inside the shower the floor falls, so the north-south floor joint is the
# slightly wider slope joint. Plan pitch stays 598 mm, so the lines meet.
# Grid origin is the module boundary 555 mm west of the east wall, on the
# south wall: (13.67, 10.15). Tiles hang from the east, so the east piece is
# the 555 mm cut marked on the spárořez. The glass stands on the next joint
# west of that, x=13.072. Shower clear width 1.153 m (555 + 598).
# Shower is the full-depth east bay. One-way fall, 1.25%, from the north wall
# (the wall opposite the drain) to the south. The whole north edge stays at 0.
# Drop over 2.100 m is 26.250 mm. A linear drain, 80 mm, sits on the south
# edge and takes that low line. A point drain would not, because the south
# edge is level.
# Course lines are struck from the drain, as in 1.20, so the bottom tile is a
# full 1194 mm at the low point and shorter on the level floor. The shared
# course joint is at 1169.750 mm. The window sill at 1750 mm is 580.250 mm
# above that joint. The SketchUp "555 mm" vertical is the same gap struck
# from floor zero (1750 − 1196 = 554, written 555). It is not the course used
# here, because that course would make the bottom tile at the drain taller
# than the 1194 mm blank.
# Niche: the 596 mm tile on the north wall inside the shower, upper course,
# 400 mm tall, bottom on the course joint. Not a measured niche.
# Mixers sit on a joint (BATERIE NA SPÁRU): the vanity on the vertical joint
# nearest the window centre, the shower valve on the east wall at the joint
# 1196 mm from the south and on the course joint. Fixtures are notes, not solids.
# Floor build-up, bottom to top, 250 mm at finished-floor zero:
#   waterproofing 8, EPS 100S 80+50, nop board 50, screed 49, adhesive+tile 13.
# The fall is taken in the screed. EPS under the shower stays 80+50.
# Screed at the drain is 22.750 mm, below the 45 mm minimum above the nops.
# That is reported, not changed. Omitting the bottom 50 mm EPS under the
# shower only (as on 1.20) would leave 72.750 mm of screed at the drain.
# Screed, membrane, and ceiling are properties. They are not extruded.
# The tile solid is the 8.5 mm ceramic. The 13 mm finish is the build-up sum.
