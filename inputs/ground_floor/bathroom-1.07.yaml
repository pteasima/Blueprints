# Room 1.07 (Koupelna), the large bathroom: bathtub to the west, double
# washbasin under the north window, walk-in shower to the east.
# Lengths are metres. Storey coordinates, the same frame as ground-floor.yaml.
# Clear inner faces, after the radon chase moved into the neighbouring room:
#   west  x=9.725   (W-039 / W-040 inner face, the full depth)
#   east  x=14.225  (W-045 / W-046 inner face)
#   south y=10.15   (W-022 inner face)
#   north y=12.25   (W-026 inner face)
# Clear size 4.500 × 2.100 m. Model area 9.450 m².
# The ZTI room table (D.1.4.1.03) lists 8.91 m². These faces are the tiling
# boundary; the difference is not closed here.
# Clear height 2.500 m (legend s.v.).
# +X east, +Y north.
# Door OP17 is in the south wall, x=11.50–12.50, leaf height 2.100 m.
# The partition is 125 mm, so the floor stops on the inner face.
# Window OP15 is in the north wall, x=9.95–12.85, sill 1.750 m, head 2.500 m.
# The wall file has no window on the west wall.
# Tiles are ABK Poetry Stone, rectified, 8.5 mm:
#   floor outside the shower 596×596
#   shower floor 555 mm across the opening, 600 mm in the fall direction
#   walls 596×1194 portrait, except the north shower wall at 555×1194
# Wall joint 2 mm. Plan pitch on the level floor is 598 mm.
# Grid origin x=11.403 puts the 2 mm floor joint on the door centre, x=12.000
# (door OP17 is x=11.50–12.50). The same origin is a module boundary, so the
# two tiles that meet there have no grout until the model opens a 2 mm joint.
# Shower clear is the drawn 555 | 2 | 555 module, 1112 mm, from the east tile
# face (x=14.2165) to the glass east face (x=13.1045). The glass solid is
# 8 mm, origin x=13.0965, on that module line. 555+2+555 cannot be 1100 mm.
# The KOV grate is 1100 mm, 12 mm short of this opening. The floor in the
# shower uses the same 555 mm modules, so there is no 86.5 mm or 430 mm cut.
# The shower falls 1.25% from the south (the side opposite the drain, at the
# same 0 as the level floor) toward the north. The drain is a wall drain in
# the shower pre-wall, across the 1112 mm opening.
# KOV 3G110CM (kovshop): overall 1140×127 mm, grate length 1100 mm, grate
# width 35 mm, installation height 52 mm, depth 47 mm, outlet Ø40 mm.
# The catalog body is 28 mm longer than the 1112 mm opening. Its ears are
# cut or recessed into the wall. That recess is a note only.
# Stainless edge profiles, 10 mm wide, follow the 1.25% fall on both sides
# of the shower floor (glass and east wall). Wall tiles start at height 0.
# They do not follow the fall.
# Both pre-walls are 186.5 mm masonry. With the 8.5 mm face tile the finished
# face is one plane at y=12.055. There is no step between them.
# The washbasin pre-wall top is a tiled shelf at the 1194 mm course joint.
# Above that shelf the north wall is plaster, including the band up to the
# window sill. Shower walls stay two courses, head 2390 mm.
# A 180 mm shelf stands west of the tub, at the tub height of 450 mm.
# 180 mm, not the estimated 150 mm, is what puts the tub's east face on the
# joint after exactly two uncut 596 mm floor tiles from the door-centre joint.
# The shower pre-wall is 2500 mm high. The glass is 2450 mm, so the pre-wall
# projects 50 mm above it. In plan the glass stops 50 mm short of the face
# (north end y=12.005), so the face also projects past the glass edge.
# Niche: on the north shower wall, from the glass end, 400×280 mm, bottom
# on the 1194 mm joint, left of the mixer. The top and the right edge are
# not on a course joint. The centre joint belongs to the mixer.
# Paffoni Tango, rozteč 150 mm. The two basin-mixer centres are on the
# joints at x=11.403 and x=12.598: outer holes 1195 mm apart, centres
# 1045 mm apart. A 1200 mm pair of holes is not a multiple of the 598 mm
# module (two modules are 1196 mm). The vanity is 1600 mm so the 400 mm
# basins sit on those centres. No vanity product was named.
# The shower mixer is one Tango, rozteč 150 mm, centred on the 555 joint.
# Mirrors are a note only, one above each basin.
# Glass: 8 mm, 700 mm walk-in opening at the south.
# Floor build-up at finished-floor zero, 250 mm:
#   level floor: waterproofing 8, EPS 100S 60+60, nop 50, screed 59, finish 13.
#   shower: waterproofing 8, EPS 100S 60+40, nop 50, screed 79, finish 13.
# The 8 mm membrane is what makes those layers add to 250.
# Screed, membrane, and ceiling are properties. They are not extruded.
# The tile solid is the 8.5 mm ceramic. The 13 mm finish is the build-up sum.
