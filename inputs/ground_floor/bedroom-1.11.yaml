# Room 1.11 (Ložnice) field devices. yaml-ifc electrical schema
# The 2D plan (docs/previews/bedroom-1.11/) is what Petr is reviewing.
# These Origins are the first 3D pass and are not the approved positions.
# (pteasima/yaml-ifc PR #7, vendored at 0f96c26). Lengths are metres.
# Boxes sit in the room. No back boxes, no wall host, no panels, no routes.
#
# Sources, not the permit electrical PDFs:
#   FixturePlan.pdf — Petr's marks on a floor-plan screenshot.
#   CableSchedule.xlsx, sheet Soupis (legend in column A) and sheet Kabelaz.
# The green mark on the plan is panel(cable), zero-padded, for example
# 2(011) is panel 2, cable 11. The Soupis panel is what is stored. A mark
# whose first digit did not read as that panel is named below.
#
# Id is C<cable>-<device code>, plus -1/-2 when one cable has two of the
# same code. CableNumber and Panel are Pset_YamlIfc. Home joins on those.
# DeviceCode, CableSpec, and CableLength repeat the Soupis row.
#
# Room faces, from ground-floor.yaml (axis ± half thickness):
#   west  x=0.450   W-030 inner face
#   east  x=3.750   W-031 west face
#   south y=3.275   W-002 inner face
#   north y=7.950   W-013 south face, extended across this bay
# W-013 itself starts at W-031, so the model has no north wall solid on
# 1.11. The drawing does: clear width 3300 mm, clear depth 4675 mm.
# 3.300 × 4.675 = 15.428 m². The room table lists 22.98 m².
#
# Plan registration, screenshot pixels to those faces. Image y is down.
#   west inner px 118, east inner px 279, south inner py 674, north py 462.
#   world_x = 0.450 + (px - 118) / 161 * 3.300
#   world_y = 7.950 - (py - 462) / 212 * 4.675
# The two scales differ by about 8 percent. Each device below is the plan
# mark, pulled inside these faces. A symbol that sat on the wall line is
# inset so the box is in the room.
#
# Mounting, Czech residential defaults, not written on the plan:
#   wall button centre 1.05 m (box base 1.01, height 0.08)
#   data outlet centre 0.30 m (base 0.26)
#   window and door contacts at 1.00 m
#   ceiling boxes at base 2.40 or 2.42, top at or under 2.48
#   pendant base 2.05, top 2.35 (the plan's hanging light)
#   blind actuator base 2.32, under the 2.50 m window head
# The bedroom clear height in the wall file is the range 2.50–4.875 m.
# Which side is the low side is not in this model, so nothing is placed
# above 2.50 m. OP01 (west) and OP05 (south) are sill 0, height 2.50.
#
# Open questions — not resolved by moving a box:
#   SCHUKO: the plan legend's red socket icon is on the north wall, the
#   east wall (twice), and outside the southwest corner. Soupis has no
#   socket cable for 1.11, so those marks are not devices here.
#   cable 12: CYKY 2x1.5, the only 2-core light. Assigned to the pendant
#   because that bulb is marked "?" (no cable number) and 120W. A west
#   outdoor lamp also reads as (012), with a first digit that is not 2.
#   The south outdoor lamp reads as (141), which is not a 1.11 cable.
#   cable 3: 2(003) is written in the same east cluster as lamp 2(005),
#   and there is one bulb icon. C3-S is a second box 0.45 m from C5-S.
#   cable 6: Soupis is V and 2V on one cable. The plan shows one 532-4U
#   outside the southwest corner. C6-V is placed beside C6-2V; it has no
#   mark of its own.
#   cable 32: shared with 1.05, length 2 m, devices V, V, M. No (032) mark
#   was readable in the room. Placed at the northwest door the plan draws
#   and the wall file does not (no opening). C32-V-2 is the corridor half,
#   north of y=7.950. The door width is not taken from a model opening.
#   cable 16: the (16) blind mark sits on the northwest corner, past the
#   room face. The box is on the west wall, north of OP01.
#   Handwritten panel digits (4, 5, 7) on some blinds and the outdoor lamps
#   did not match Soupis panel 2. Panel is the sheet's Rozvadec.
#   Area 22.98 m² against the 15.428 m² clear rectangle above.
