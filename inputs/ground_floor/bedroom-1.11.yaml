# Room 1.11 (Ložnice) field devices. yaml-ifc electrical schema
# The 2D plan (docs/previews/bedroom-1.11/) is what Petr is reviewing.
# These Origins are the first 3D pass and are not the approved positions.
# (pteasima/yaml-ifc PR #7, vendored at 0f96c26). Lengths are metres.
# Boxes sit in the room. No back boxes, no wall host, no panels, no routes.
#
# Sources, not the permit electrical PDFs:
#   FixturePlan.pdf — Petr's marks on a floor-plan screenshot.
#   CableSchedule.xlsx, sheet Soupis (legend in column A) and sheet Kabelaz.
# The green mark on the plan is panel(cable), zero-padded, for example
# 2(011) is panel 2, cable 11. The Soupis panel is what is stored. A mark
# whose first digit did not read as that panel is named below.
#
# Id is C<cable>-<device code>, plus -1/-2 when one cable has two of the
# same code. CableNumber and Panel are Pset_YamlIfc. Home joins on those.
# DeviceCode, CableSpec, and CableLength repeat the Soupis row.
#
# The wall model closes a bay of 3.300 × 4.675 m (15.428 m²):
#   west  x=0.450   W-030 inner face
#   east  x=3.750   W-031 west face
#   south y=3.275   W-002 inner face
#   north y=7.950   W-013 south face, and W-031 stops on that line
# The floor plan keeps the room going north to W-018 (south face y=9.500,
# 125 mm thick). That rectangle is 3.300 × 6.225 m = 20.543 m². The room
# table lists 22.98 m². The remaining 2.44 m² is not drawn.
# The 2D plan is the position. Origins below are the first 3D pass.
#
# Bed outline, screenshot pixels registered to the model bay. Image y is down.
#   west inner px 118, east inner px 279, north py 462 = y 7.950.
#   world_x = 0.450 + (px - 118) / 161 * 3.300
#   world_y = 7.950 - (py - 462) / 212 * 4.675
# Corners (184, 539) and (267, 612), rounded to 1 mm, are on BED-1.11.
# That bed is UNFINISHED placeholder furniture, not a solid.
#
# House centres, millimetres, on the 2D plan (see PlanNotes.md):
#   socket 300, ethernet one module above it, button 1350, next button above
#   150 from a door edge, 300 from an inner corner, 300 from an outer corner outdoors
#
# Decisions recorded from the review, still not a moved 3D box:
#   SCHUKO sockets are position only. No cable number, no circuit, wiring skipped.
#   cable 12 is the pendant above the bed (CYKY 2x1.5).
#   cable 3 is the LED strip under the bed, around the unfinished outline. No box.
#   cable 6 is one 8-core cable: the double and the single, one outdoor stack.
#   cable 32 is the door contact plus the bedroom switch and the hallway switch.
#   The door is the floor-plan leaf. The wall model has no opening there.
#   cable 16 is the blind for the narrow west window OP02.
#   The two outdoor lamps stay, marked UNUSED, and are not wired or counted.
#   The mmWave (cable 9) is inside the bedroom door switch, not its own dot.
