# Room 1.17 (Chodba) field devices. yaml-ifc electrical schema, the bedroom
# format (inputs/ground_floor/bedroom-1.11.yaml). Lengths are metres.
# Boxes sit on the wall face or under the ceiling. No back boxes, no routes.
#
# Sources, not the permit electrical PDFs:
#   FixturePlan.pdf — Petr's marks on a floor-plan screenshot (Home repo,
#     sources/). Device positions are the plan symbols, read from the PDF
#     vector symbols with a fit to ground-floor.yaml (about ±3 cm).
#   CableSchedule.xlsx, sheet Soupis — cable number, devices, spec, length,
#     panel, note. Exterior cables are listed under the room where the cable
#     goes through the wall (Soupis note on cable 66), and so are they here.
# The green plan mark is cabletype(cable): 1 UTP, 2 CYKY 4x1.5, 3 CYKY 4x2.5,
# 4 CYKY 3x1.5, 5 CYKY 2x1.5, 7 CYKY 2x2.5 (sheet Kabelaz). Each element
# carries the mark it was read from in its Description.
#
# Ids: C<cable>-<code>[-n] as in the bedroom. SOCK-<room>-<place>[-k] for
# position-only sockets. Q<plan cable>-<code> where the plan number clashes
# with a different Soupis row, NC-<room>-<code> for a drawn fixture with no
# cable mark; both carry CableQuestion, and Question says what to decide.
# Unplaced rows (no plan position) have no box and PositionUnknown.
#
# House rules (docs/electrical/PlanNotes.md): switch centre 1350, next one
# +71; sockets 300/371/442, above a counter 1400; 150 mm from a door edge
# (latch side), 300 mm from an inner corner or an outdoor outer corner; a
# radar on a switch's cable sits in that switch box (InSwitchBox).
# Contacts: on the latch jamb, centre 1.00 (high windows: sill + 0.15).
# Blinds: on the facade beside the window, 150 mm past the jamb, bottom 2.32.
# Outdoor wall lamps: centre 2.20. Gutter heating: a 0.30 m box at 2.95 on
# the facade where the plan marks it.
# Controls on a button lists the lights it switches: by default every light
# of this room on the same side of the facade (Petr: switches control lights;
# no separate blind switches). Data only; the viewer does not use it yet.
#
# Per-room notes and the open questions: docs/electrical/rooms/1.17.md.
