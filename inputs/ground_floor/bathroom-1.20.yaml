# Room 1.20 (technical bathroom by the entrance hall), in storey coordinates.
# Adapted from yaml-ifc samples/bathroom.yaml at 0f96c26. Lengths are metres.
# Clear inner faces, checked against ground-floor.yaml:
#   west  x=30.15  (W-054 inner face)
#   east  x=32.325 (W-057 inner face)
#   south y=6.025  (W-009 inner face)
#   north y=7.95   (W-015 inner face)
# Clear size 2.175 m east-west by 1.925 m north-south.
# +X east, +Y north. The door is in the north wall. The drain is the southwest
# corner, diagonally opposite the door.
# 0 is the finished floor of the entrance hall. The plane is 0 at the northeast
# corner (the door corner) and falls toward the drain. Nowhere in the room is above 0.
# Gradient is the 1.5% diagonal, stored to 6 decimals:
#   diagonal 2.904522 m, fall 43.566 mm.
#   along the walls, 1.1232% east-west and 0.9941% north-south.
# Across any 800 mm east-west, including the door leaf, the fall is 8.986 mm.
# No threshold. The joint at the leaf is silicone; it is not a grout module.
# Wall joint 2.000 mm (rectified porcelain). Floor joints are derived, not stored.
# Floor grid: full tiles at the drain (southwest). GridOrigin is that corner.
# Cuts land on the door side: 369 mm along the east wall, 119 mm along the north wall.
# Every wall uses that same origin. Vertical joints continue the floor's 602 mm
# plan pitch. The window and the door cut whatever tiles they cross; the grid
# does not restart on a jamb. The north wall keeps the piece above the door
# where a joint falls just inside the opening (about 27 mm).
# Bottom course follows the slope (BottomCut follow-slope) with a constant 2 mm
# vertical gap. At the drain corner the bottom tile is a full 1200 mm tall.
# Two courses, no top strip. The top edge is level. The soffit is 2.500 m.
# W-054's axis stops at the window and W-015's axis stops at the door's east jamb.
# The tile still covers the clear faces, including the 250 mm west pier and the
# 100 mm north pier. Those piers are the wall segments; they are not extra strips.
# Screed thickness, adhesive, membrane thickness, and the drain body below the
# grate are not measured, so they are not extruded. The grate solid is a nominal
# 8 mm and is not written back.
