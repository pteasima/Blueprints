# yaml-ifc sample: ground floor of RD Šíma (walls and openings only).
# Design facts and the known gaps: docs/design/ground-floor.md.
# Coordinates are metres in the local plan from samples/source/ground-floor.json
# (origin at the min corner of the kept silná edges; model-space origin
# 4698.8019 m, -615.0793 m). X to the right, Y up the sheet, Z up.
#
# Wall axes are centerlines measured from parallel silná faces, thickness
# centered on the axis. Collinear pieces of one axis are one wall, including
# across an opening. See docs/spec.md. Edges that are only jambs or reveal
# steps are not walls of their own.
#
# Height is omitted on every wall. Clear height in the drawing is per room
# (samples/source/heights-notes.txt, column s.v.), and IfcSpace is deferred,
# so a wall is not given one height:
#   2.50 m  1.03 1.04 1.05 1.06 1.07 1.08 1.09 1.10
#   2.55 m  1.01 1.19 1.20 1.21 1.22 1.23
#   2.75 m  1.16 garage, 1.17 hall
#   3.00 m  1.12 1.13 1.14 1.15
#   1.02 living room 2.50–5.05 m, 1.11 bedroom 2.50–4.875 m (ranges).
# Datum ±0.000 = 472.100 m Bpv, stored as the site RefElevation.
#
# Not represented: PASS-1.17-1.16 (former OP44). Petr 2026-10-05: the hall
# continues into the garage at full width and full height, no wall, no door,
# no lintel (x 37.85–38.10, y 10.05–11.25). An opening needs a wall to void.
# The unused text "2500" at that gap is not an opening.
# Door SillHeight, where the source left sill empty, is head minus height
# (the written head equals the leaf height, so the leaf starts at the floor).
