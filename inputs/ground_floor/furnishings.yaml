# Kitchen and living furniture for room 1.02 (obývák), rough boxes the owner edits.
#
# Schema follows yaml-ifc furnishings (commit 34e1597): one box per element.
# Origin is the minimum corner in storey metres (X east, Y north, Z up).
# Width is along +X, Depth along +Y, Height along +Z. RefDirection is omitted
# because every box is axis-aligned. ObjectType is a family name with no size.
# ContainedInStructure points at the IfcSpace for this room.
#
# The private yaml-ifc tree at 34e1597 is not in this checkout (the vendored
# package is still the walls commit 4ad102f). These lists use the field names
# from that furnishings release. Walls stay in ground-floor.yaml; do not move
# them to make a box fit.
#
# Room 1.02 clear rectangle, measured from the wall footprints:
#   west  W-050 east face   x = 18.80
#   east  W-056 west face   x = 29.90   (clear length 11.10 m)
#   south gable ends        y = 10.25   (W-023 glass is 25 mm further south)
#   north W-029 south face  y = 15.60   (clear width 5.35 m)
# Kitchen is the west end (W-050 has two pocket doors: OP24 at the glass,
# OP25 toward the cabinet wall). Living is the east end (W-056 has one
# pocket door, OP33, at the glass). The terrace glazing is the south wall.
# Cabinets sit on the solid north wall, which is the cabinet eave.
#
# Two 300 mm piers stand in front of that north wall and the boxes stop
# short of them:
#   W-052  x 22.15–22.45, y 15.35–15.60
#   W-053  x 25.15–25.45, y 15.35–15.60
#
# Assumptions (edit the numbers; the solids follow this file):
# - Base modules 600 deep and 900 high, wall modules 350 deep, tall units
#   and the fridge 2100 high. Widths are 600 or 800. The island is three
#   600 modules wide and 900 deep.
# - The SketchUp shows a window over the sink. W-029 has no opening, so
#   there is no wall cabinet over the sink and no new window.
# - Oven, cooktop and sink are thin boxes on the base modules, not a
#   second carcass. The hood is a ceiling hood under a short wall cabinet.
# - The sectional is one box (its overall footprint), not an L of two.
# - Track lights hang at 2.45 m, under the low side of the 2.50–5.05 m
#   clear height. The ground-floor model has no ceiling.
# - Bar stools are chairs. There is one rug, under the sofa.
