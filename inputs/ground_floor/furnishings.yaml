  # underside of the soffit. It also means that you do need to worry about
  # the room for the flip up cabinet door. Please adjust it and I'll send it
  # to the architect for approval (his model was too simplified)." Part of
  # the cabinet (oak, furniture), not the drywall. 40 thick since t1013u
  # (Petr: same as the shelves, bookshelf side panels and oak counter; was
  # 18, guess: carcass board). Top stays on the 2450 ceiling line, so the
  # 20 gap to the GKB underside (2470) stays (guess: a shadow gap or a
