# Room 1.02 (obývák) furnishings. yaml-ifc at commit 34e1597.
#
# Kitchen boxes only, from KitchenPlan.jpg (2448×1809). The island is the
# blue column on the dark panel: five modules, north to south, red widths
# 500, 600, 500, 600, 300 (2500). The green rectangle is the single sink in
# the north 500. The two green round bowls sit across the second 500 and the
# second 600. Depth is the column's east-west width, modelled at 1200.
# One BaseCabinet per module, counter 930. No hinge: the blue strokes are
# the outline. Product cards, the yellow notes, and STŮL LIBRA are not
# cabinets. The ostrov note (plinth on the other side) is why the column is
# freestanding.
#
# Not a wall run. The red 7200 sits above the column, on the top blue line.
# There is no cabinet outline along the north wall, so there is no SF-N7200
# and no separate wall 500. The same 7200 is the long dimension line at the
# bottom of the sheet (see registration). The readable "11100" at pixel
# (1636, 1375) is the room width; at this scale that line is 3208 px and
# does not fit the 2448 px frame, so it is not a base cabinet. "5350" is
# not a readable glyph. 2450 is the door-height note stacked under each
# 1100 (48 px below it, 166 mm), not a plan length and not a tall unit.
#
# Registration, pixel to storey (image y down, world Y north):
#   px/mm = 0.28986. The two "1100" labels are OP25 and OP24, door width
#   1100, centers 3600 mm apart: pixel y 442.5 ↔ world y 14.40 (OP25),
#   pixel y 1486 ↔ world y 10.80 (OP24).
#   Anchor X: the bottom dimension line y=1719 runs x=93 to x=2175
#   (2082 px = 7182 mm), the 7200, starting at the west inner face.
#   pixel x=93 ↔ world x=18.80.
#   world_x = 18.80 + (px - 93) / 0.28986 / 1000
#   world_y = 14.40 - (py - 442.5) / 0.28986 / 1000
# Column stroke centres: west x=594.5, east x=956, north y=622, south y=1335
# (drawn 1253×2460 mm). The 1200×2500 boxes are centred on that rectangle.
# A line at x≈773 splits the width near 600+600, but the east half has no
# module divisions (top and bottom returns only), so this is one 1200-deep
# row, not two back-to-back cabinet rows. The east return is the plinth side.
# Clear of the inner faces: west 1.754, east 8.146, north 1.800, south 1.050.
#
# One whole element per box. The list key is the IFC class:
#   furniture, systemFurniture, sanitaryTerminals, electricAppliances,
#   lightFixtures, coverings.
# Origin is the plan corner [x, y] in storey metres (X east, Y north).
# Elevation is the base Z; omitted means 0. Width is local X, Depth local Y,
# Height up. RefDirection omitted means [1, 0]. ObjectType is a family name.
#
# The space is the room an element can belong to. It has no body.
# Clear height in the drawing for 1.02 is 2.50–5.05 m, and that is not a field.
