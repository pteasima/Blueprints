# Room 1.02 (obývák) furnishings. Written for yaml-ifc at commit 34e1597.
# The vendored package is now 0f96c26. Upstream's furnishings sample at that
# commit is a generic kitchen and is not this file.
#
# KitchenPlan.jpg (2448×1809). Two groups: the tall run on the north wall,
# and the freestanding island. Counter 930. Tall cabinets 2450, the height
# Petr wrote. Product cards other than the fridge, and STŮL LIBRA, are not
# cabinets. The Ninja KT200EU card (pixel x 1123–1241) is a kettle.
#
# Registration. Image y is down, world Y is north. The door scale stands:
#   px/mm = 0.28986. The two "1100" labels are OP25 and OP24, 3600 mm
#   between centres: pixel y 442.5 ↔ world y 14.40, pixel y 1486 ↔ world
#   y 10.80.
#   X is the same scale. It is not taken from the red handwriting. The west
#   wall's two faces are the verticals at pixel x=22 and x=93 (71 px ≈
#   245 mm, the 250 mm wall). The inner face is x=93 ↔ world x=18.80.
#   world_x = 18.80 + (px - 93) / 0.28986 / 1000
#   world_y = 14.40 - (py - 442.5) / 0.28986 / 1000
# The red mark above the island is a handwritten 1200, the island's overall
# width, not a 7200 dimension. The long line at pixel y=1719 (x=93 to
# x=2176, 2083 px ≈ 7188 mm) is a DWG dimension; the island does not use it.
#
# Tall run, west to east, backs on the north inner face y=15.6. Note x-spans
# (sticky yellow), then the world x those spans map to:
#   T1    px 89–287    → 18.79–19.47   "dvere 60L, sirka skrine az ke zdi (~75)"
#   fridge note 338–513 → 19.65–20.25  "naproti pruchodu (ne v rohu)"
#   fridge card 294–534 → 19.49–20.32
#   T2    px 533–688   → 20.32–20.85   "nahore dvere 60R"
#   T3    the card gap 688–858 → 20.85–21.44  (DGC 7465, M 2230)
#   T4    px 858–1045  → 21.44–22.09   "zbyva sirka cca 50"
# T1 is 750, from the west inner face to the fridge, which matches the note
# (~75) and the note's east edge within 80 mm. The fridge is its real
# 908×716×1876, packed against T1. T2 and T3 are 600, T4 is 500.
# Tall carcasses are 600 deep. The fridge is 716 deep and projects 116 mm
# past the cabinet faces; the run is not deepened to match it.
# Fronts face south: Origin is the south-west corner, Width runs east,
# Depth runs north (RefDirection omitted, the default [1, 0]).
# yaml-ifc has no hinge field. 60L and 60R are PropertySets named
# Pset_CabinetDoor, property HingeSide, on SF-T1 and SF-T2. L/R is as you
# face the front. T3 and T4 do not state a hinge.
# The fridge is IfcElectricAppliance, PredefinedType FRIDGE_FREEZER.
# FREESTANDINGFRIDGE is not in the yaml-ifc enum. It is aligned to OP25,
# the north door in the west wall W-050 (y 13.85–14.95). Its south face is
# y=14.884, 66 mm south of that door's north jamb, so the appliance stands
# in the line of the doorway and T1 keeps it out of the north-west corner.
# OP28, the wide south opening (x 22.05–26.45), is east of this note.
# OP24 is the south door on the same wall. T4's east face (x=22.158) nicks
# pier W-052 (x 22.15–22.45, projecting to y=15.35) by 8 mm. The pier is
# not cut out of the box.
#
# Island. Outer stroke centres: west x=594.5, east x=956, north y=622,
# south y=1335 (drawn about 1253×2460). The 2500×1200 boxes are centred on
# that rectangle: west 20.554, east 21.754, north 13.800, south 11.300.
# The faint line at x≈773 (world x≈21.15) is the split. Two rows, each 600
# deep, overall 2500×1200, counter 930.
#   West row, faces west. RefDirection [0, -1]: Origin is the north-west
#   corner, Width runs south, Depth runs east. Modules north to south
#   500, 600, 500, 600, 300. The green rectangular sink is in the north
#   500. The two round bowls cross the second 500 and the second 600.
#   East row, faces east. This is the plinth and robot-dock side. The east
#   half has no module lines (top and bottom returns only), so the 2500 is
#   split 600/600/600/700 from north to south, the 700 at the south.
#   RefDirection [0, 1]: Origin is the south-east corner, Width runs north,
#   Depth runs west.
# Clear of the inner faces, to the island outline: west 1.754, east 8.146,
# north 1.800, south 1.050.
#
# West-wall run, across from the island, between OP25 and OP24. The notes
# are the left-hand column. North to south: A 850, B 800, C 850 (2500).
# Facing the west wall, left is south and right is north. In A the 250
# pull-out is south and the dishwasher is north. In B the bin is south and
# the compost is north; that is a property on the one 800 box.
# W-050 starts at y=10.25. OP24 is AlongAxis 0, width 1.1, so y 10.25–11.35
# (north jamb 11.35). OP25 is AlongAxis 3.6, width 1.1, so y 13.85–14.95
# (south jamb 13.85). The clear gap is 2500. The run fills it: y 11.35–13.85.
# Clearance at each jamb is 0. The island is left where it is.
# Bases are 600 deep and 930 high, backs on the inner face x=18.8, fronts
# facing east. RefDirection [0, 1]: Origin is the south-east corner, Width
# runs north, Depth runs west. The Bosch dishwasher is the real
# 598×550×865, centred in the north 600 of A, back on the wall.
# Wall cabinets: depth 350, height 900, bottom at 1550 (620 above the 930
# counter), top at 2450. Elevation 1.55.
# The Teka bowl is an IfcSanitaryTerminal, 750×440×200, centred in the 800,
# top flush with 930. The disposer and the tap are not modelled.
#
# One whole element per box. The list key is the IFC class:
#   furniture, systemFurniture, sanitaryTerminals, electricAppliances,
#   lightFixtures, coverings.
# Origin is the plan corner [x, y] in storey metres (X east, Y north).
# Elevation is the base Z; omitted means 0. Width is local X, Depth local Y,
# Height up. RefDirection omitted means [1, 0]. ObjectType is a family name.
#
# The space is the room an element can belong to. It has no body.
# Clear height in the drawing for 1.02 is 2.50–5.05 m, and that is not a field.
#
# Living room, plan v3. The kitchen boxes above are unchanged. North inner
# face y=15.60, east inner face x=29.90. The base run is x 22.15–29.90,
# front y=15.15, depth 450, so the back sits on the north face. Piers
# W-052 (x 22.15–22.45) and W-053 (x 25.15–25.45) project to y=15.35.
# In front of each pier the box is 300 wide and 200 deep, front flush.
# The 450 run stops at the pier and starts again on the other side.
# W-053's east face is x=25.45 and the sofa's west face is x=25.52, so a
# 70 mm counter-height piece fills that gap. Both piers are west of the
# sofa, so the fillers and that sliver are at the kitchen counter, 930.
# Behind the sofa the base is 800, 40 mm above the 760 back. The tall
# corner cabinet takes the east 200 (x 29.70–29.90), floor to 2450, the
# kitchen tall height, not the 5.05 slope. It is one armrest wide.
# Oak-front wall cabinets follow the kitchen wall cabinet: depth 350,
# bottom 1550, height 900, top 2450. A 350 cabinet from the wall would
# enter a pier (pier face y=15.35, cabinet front would be y=15.25), so
# the wall cabinet is only the clear bay x 22.45–25.15.
# The bookshelf is above the sofa, x 25.52–29.70, depth 250 (front
# y=15.35, which is the pier face, so it does not pass the piers). Bottom
# 850, 50 mm above the low base, top 2450. Three shelf boards, oak
# lamella on the back. Sides, top and shelves are 20. Slats are 40 wide,
# 20 apart, 12 thick. Those thicknesses are not on the plan.
# Sofa, Livom Harvey, matching the configurator (4.38 × 3.78 × 0.76).
# Catalogue (livom.de): seats S4 1160×1160×395, S2 1160×860×395,
# S3 1460×860×395. Arm and back cushions are 300 thick. The 75.5 cm
# cushions are 755 high; the screenshot says 0.76, so the model uses 760
# (5 mm above the catalogue). Seat height stays 395.
# The 86 run is the north leg, free end at the TV wall. From the east:
# arm, chaise 1460 along × 860 deep, 116×86, corner 116×86. The chaise
# is in line with the other two 860-deep seats (y 13.99–14.85). The
# other leg is the two 116×116 squares running south, then an arm.
# Backs are 300 thick and 760 high, outside the seats, and each one ends
# flush with its seat. The two that meet at the inner corner are each
# 1160: the north one is the corner seat's 1160 edge, the west one is the
# corner's 860 side plus the 300 return that caps that corner. The chaise
# back is 1460, flush with the chaise (x 28.14–29.60). The south-end west
# back is 1160, flush with that seat (y 11.67–12.83).
# Arms are the Livom low armrest: 860 long, 660 high, 300 thick. Each
# starts at the outer face of the back and closes the corner. East arm
# y 14.29–15.15. South arm x 25.52–26.38.
# East-west is 300 + 1160 + 1160 + 1460 + 300 = 4380. North-south is
# 300 + 860 + 1160 + 1160 + 300 = 3780. East face x=29.90 on the TV wall,
# west face x=25.52. The TV spans y 11.585–13.815. The east arm ends at
# y=14.29, 475 mm north of the TV. No overlap.
# Gatta, Kaplan 1934. 1100 × 2400, catalog height 760 (the plan's ~750).
# Long axis north-south, y 11.35–13.75. Centred in the island-to-sofa
# gap: island east face x=21.754, sofa west x=25.52, centre x=23.637,
# so the top is x 23.087–24.187. Each side gap is 1333. Top 30, apron
# 60×20 set in 40, legs 50 square set in 80. Lacquered natural oak.
# The plan's "Ancona x6" is not a modeled product. Six simple oak chairs,
# 500 deep (east-west) by 450 wide, seat top 450, back top 800. Three on
# each long side, centres 400/1200/2000 along the 2400. Backs face away
# from the table. Legs 40, seat board 36, back board 20.
# Rug 2800 × 3780 × 10, x 26.65–29.45, y 11.37–15.15. Furniture is not
# lifted, so the rug and the seats overlap by the rug thickness.
# TV. Visible 16:9 screen of a 100 inch set is 2214 × 1245.
# Overall without the stand, a typical 2025/2026 set (LG 100QNED86):
# 2230 × 1277 × 49.9. Modeled 2230 × 1277 × 50, centred on y=12.700
# (centre of y 10.25–15.15, the room below the 450 cabinet), so
# y 11.585–13.815, 225 mm south of the full-room centre. Bottom stays
# 650. IfcAudioVisualAppliance is not in
# this yaml-ifc pin, so it is USERDEFINED / Television. No cabinet under it.
# Subwoofer is the same kind of appliance, ObjectType Subwoofer. No
# catalog size: a 350 cube, 300 clear of the east wall and of the cabinet
# front (east face x=29.60, north face y=14.85). That sits inside the
# east seat. The plan's red dot is in that corner; the clash is flagged.
