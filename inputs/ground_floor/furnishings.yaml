# Kitchen and living furniture for room 1.02 (obývák).
#
# yaml-ifc furnishings at commit 34e1597 (docs/spec.md). One whole element
# per box. The list key is the IFC class. Origin is the plan corner [x, y]
# in storey metres (X east, Y north). Elevation is the base Z; omitted
# means 0. Width is local X, Depth local Y, Height up. RefDirection is
# omitted because every box is axis-aligned ([1, 0]). ObjectType is a
# family name. The converter stores that string as written.
#
# The space is the room furnishings belong to. It has no body: no
# footprint and no height. The drawing's clear height for 1.02 is
# 2.50–5.05 m and stays a note, not a field.
#
# Room 1.02 clear rectangle, measured from the wall footprints in
# ground-floor.yaml (those walls are not in this file):
#   west  W-050 east face   x = 18.80
#   east  W-056 west face   x = 29.90   (clear length 11.10 m)
#   south gable ends        y = 10.25   (W-023 glass is 25 mm further south)
#   north W-029 south face  y = 15.60   (clear width 5.35 m)
# Kitchen is the west end (W-050 has two pocket doors: OP24 at the glass,
# OP25 toward the cabinet wall). Living is the east end (W-056 has one
# pocket door, OP33, at the glass). The terrace glazing is the south wall.
# Cabinets sit on the solid north wall.
#
# Two 300 mm piers stand in front of that north wall and the boxes stop
# short of them:
#   W-052  x 22.15–22.45, y 15.35–15.60
#   W-053  x 25.15–25.45, y 15.35–15.60
#
# Placement (edit the numbers; the solids are the converter's boxes):
# - Base modules 600 deep and 900 high, wall modules 350 deep, tall units
#   and the fridge 2100 high. Widths are 600 or 800. The island is three
#   600 modules wide and 900 deep.
# - The SketchUp shows a window over the sink. W-029 has no opening, so
#   there is no wall cabinet over the sink and no new window.
# - Oven, cooktop and sink are separate products on the base modules.
#   The hood is a ceiling hood under a short wall cabinet.
# - The sectional is one box (its overall extent), not an L of two.
# - Track lights are one fixture per run, at 2.45 m. This file has no ceiling.
# - Bar stools are chairs (BarStool). There is one rug, under the sofa.
