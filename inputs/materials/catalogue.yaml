# --------------------------------------------------------------- stone, tile

- id: silestone-blanco-maple
  name: Silestone Blanco Maple, 20 mm
  applies_to:
    description: >-
      Kitchen worktops (island, west run, north dining run), the island end
      cladding, and the Silestone backsplashes (west and north walls).
    selectors:
      - {label: worktop}
  base_color: "#ede8dd"
  roughness: 0.12
  metalness: 0.0
  maps:
    color: docs/materials/silestone-blanco-maple/color.jpg
    roughness: docs/materials/silestone-blanco-maple/roughness.jpg
  tile_size_m: [1.0, 1.0]
  status: known
  source:
    - https://www.cosentino.com/en-ie/colours/silestone/blanco-maple
    - https://www.stoneone.co.uk/product/silestone-blanco-maple/
    - https://in2stone.co.uk/products/quartz/silestone-blanco-maple/
  notes: >-
    Petr: "silestone maple" (kitchen-cabinets.md); Blanco Maple is the only
    Silestone colour named Maple. Cream-white base with a dense, even
    aggregate of 0.5–3 mm crumbs: white and pale grey, fewer taupe, ochre and
    grey flecks, no veining (Cosentino, stockists). Finish: standard
    polished. Petr, 2026-11-12: "cheaper basic silestone (idk which one that
    is), or just choose one"; polished is Silestone's standard finish and
    Suede costs extra, so polished it is. Texture is procedural (own work,
    CC0), calibrated by eye against a stockist slab photo (median #efeadf)
    at the same scale. Confidence: colour and finish high, speck pattern
    medium.

- id: abk-poetry-stone-trani-beige
  name: ABK Poetry Stone Trani Beige, natural, rectified, 8.5 mm
  applies_to:
    description: >-
      All bathroom floor and wall tiles: 1.07 (floor 596×596, walls 596×1194,
      niche, shelf, tub front) and 1.20. Assumed for the other wet rooms
      (WC 1.06, 1.19, bathrooms 1.09, 1.21) once they are tiled.
    selectors:
      - {label: floor_tile}
      - {label: wall_tile}
    pending: >-
      Tiles in WC 1.06, 1.19 and bathrooms 1.09, 1.21 (tiled per the floor
      take-off in scripts/export_podlaha_eps.py; product assumed the same).
  base_color: "#e0d1bc"
  roughness: 0.62
  metalness: 0.0
  maps:
    color: docs/materials/abk-poetry-stone-trani-beige/color.jpg
    normal: docs/materials/abk-poetry-stone-trani-beige/normal.jpg
    roughness: docs/materials/abk-poetry-stone-trani-beige/roughness.jpg
  tile_size_m: [0.6, 0.6]
  status: known
  source:
    - https://www.abkgroup.it/it/abk/area-download/minimali/poetry-stone/trani-beige/pf60010540-v100/
    - https://www.ceramishop.it/abk-poetry-stone-trani-beige-nat-60x60-pf60010540.html
  notes: >-
    bathroom-1.07.yaml and bathroom-1.20.yaml: "ABK Poetry Stone Trani Beige".
    Full-body porcelain, limestone look, natural (matt) finish, R10, V2 shade
    variation (stockist). base_color is the median of ABK's 24 face renders
    of the 60×60 (#dcceba–#e3d4c0). Texture is procedural (own work, CC0):
    soft cloudy limestone with fine grain, sparse fossil fragments and pores;
    one repeat ≈ one tile, so neighbouring tiles look alike unless the viewer
    offsets UVs per tile. Confidence: colour high, pattern medium.

