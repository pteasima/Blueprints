# --------------------------------------------------------------- floors, walls, ceilings

- id: floor-pu-living
  name: Poured polyurethane floor, light beige with colour chips
  applies_to:
    description: >-
      Finished floor of the dry rooms: 1.01 zádveří, 1.02 living/kitchen,
      1.03, 1.04, 1.05 hall, 1.08, 1.10, 1.11 bedroom, 1.12–1.14, 1.15 study,
      1.22, 1.23.
    selectors: []
    pending: >-
      The ground-floor model has no floor slabs yet. When it gets them, select
      them per room (IfcSlab FLOOR / IfcCovering FLOORING in those spaces).
  base_color: "#d8cdbb"
  roughness: 0.35
  metalness: 0.0
  maps:
    color: docs/materials/floor-pu-living/color.jpg
    roughness: docs/materials/floor-pu-living/roughness.jpg
  tile_size_m: [1.0, 1.0]
  status: known
  source:
    - https://github.com/pteasima/Blueprints/blob/main/scripts/export_podlaha_eps.py
  notes: >-
    The system is from the floor take-off: "PU stěrka 4" (4 mm polyurethane
    screed) in these rooms. Colour, Petr, 2026-11-12: "pu floor is light
    beige with plastic chips (not sure what color chips yet, your choice)".
    Base light beige #d8cdbb (assumed shade). Chips are our choice, sparse
    and subtle so the floor reads beige from standing height: warm beige
    #c4b297, warm grey #9a948b, off-white #f3efe6 and a few taupe #8b7d6b,
    flat irregular flakes about 2–8 mm, under a satin clear coat (one even
    roughness, chips included). Procedural texture (own work, CC0), one
    repeat = 1.0 m at 1 mm per pixel so single flakes stay visible.

