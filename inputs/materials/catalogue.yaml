# Material catalogue for the viewer's photorealistic mode (ground floor model,
# both bathroom models; not the obývák acoustic roof model).
#
# Human-readable version, sources and open questions: docs/materials/README.md.
# Validation: tests/test_materials_catalogue.py (src/blueprints/materials.py).
# Textures are rebuilt by scripts/build_material_textures.py.
#
# Contract, one list entry per material:
#   id            kebab-case, stable. Geometry never carries a material, only a
#                 label/id that `applies_to` resolves, so a later glTF fixture
#                 can name the same id in its own material slot.
#   name          display name
#   applies_to    description: what it covers, in words
#                 selectors:   which viewer meshes get it. The viewer names a
#                              mesh `<label>__<id>__` (e.g. `cabinet__KR-ISL-END-N__`)
#                              or just `<label>` when it has no id. A selector is
#                              {label, ids?, id_pattern?}; `id_pattern` is a regex
#                              searched in the id. Most specific wins:
#                              ids > id_pattern > label only. Every label the
#                              floor-plan models emit has exactly one label-only
#                              selector, so nothing falls through.
#                 pending:     (optional) surfaces this material is for that the
#                              models do not build yet
#   base_color    sRGB hex. The albedo when maps.color is absent or fails to load.
#   roughness, metalness   0..1 scalars. With a roughness map, the map is the
#                 value and the scalar is its fallback.
#   transmission, opacity, ior   glass only
#   maps          optional {color, normal, roughness, ao}: repo-relative paths.
#                 They live under docs/ because only docs/ is published to Pages,
#                 so the URL is the path without the leading `docs/`. Colour maps
#                 are sRGB; normal (OpenGL +Y), roughness and ao are linear.
#                 A map may point into another material's folder (shared scans).
#   tile_size_m   [w, h]: real-world size of one texture repeat (U, V)
#   rotation_deg  (optional) when direction matters: grain / brushing runs along
#                 texture V at 0; the viewer aligns V with the part's longest edge
#                 and then adds this rotation
#   status        known (real product, matched) | assumed (our guess)
#   source        URLs
#   notes         known: what was matched and how sure; assumed: what and why

# --------------------------------------------------------------- wood

- id: oak-natural-kaplan
  name: Natural oak, matt lacquer (Kaplan 1934, Přírodní D 02)
  applies_to:
    description: >-
      Solid and veneered natural oak furniture: the Gatta dining table, the six
      dining chairs, the bookshelf with its lamella back, the north dining run
      bodies (KR-DN), the low base behind the sofa, the tall corner cabinet and
      the oak-front wall cabinet over the dining run. Everything
      `Pset_Finish.Material: natural oak` in furnishings.yaml.
    selectors:
      - {label: oak}
      - {label: cabinet, id_pattern: "-BODY$"}
      - {label: cabinet, ids: [SF-LB, SF-TC, SF-DH]}
  base_color: "#aa7e60"
  roughness: 0.45
  metalness: 0.0
  maps:
    color: docs/materials/oak-natural-kaplan/color.jpg
    normal: docs/materials/oak-natural-kaplan/normal.jpg
    roughness: docs/materials/oak-natural-kaplan/roughness.jpg
  tile_size_m: [1.83, 1.83]
  rotation_deg: 0
  status: known
  source:
    - https://www.kaplan1934.cz/produkty/stoly/stul-gatta
    - https://www.kaplan1934.cz/kolekce-gatta/
    - https://polyhaven.com/a/oak_veneer_01
  notes: >-
    The repo names the table "Kaplan 1934 Gatta, lacquered natural oak"
    (furnishings.yaml FN-GATTA). Kaplan's oak stain "Přírodní D 02" is their
    natural oak; their lacquer is a matt lacquer (product page). base_color is
    the median of Kaplan's D 02 swatch (#aa7e60, centre crop). The texture is
    Poly Haven's CC0 oak veneer scan (straight and cathedral grain, raw mean
    #a17e57, so the re-tint is small), normal flattened to 60 % and roughness
    centred on 0.45 for a closed matt lacquer. Confidence: colour medium-high
    (a web swatch, unknown white balance); grain is generic oak, not Kaplan's
    boards, which are wider glued planks on the table top.

- id: oak-veneer-joinery
  name: Oak veneer joinery (kitchen fronts, vanity), assumed to match
  applies_to:
    description: >-
      Kitchen fronts and drawer fronts, visible end sides and plinth boards of
      the kitchen runs, the integrated dishwasher's door panel, and the bathroom
      1.07 vanity cabinet. Fallback for the furniture label.
    selectors:
      - {label: cabinet, id_pattern: "-(FRONT|D[0-9]+|END-[NSEW]|PLINTH-[NSEW])$"}
      - {label: appliance, ids: [EA-SBD6ECX]}
      - {label: vanity}
      - {label: furniture}
  base_color: "#aa7e60"
  roughness: 0.45
  metalness: 0.0
  maps:
    color: docs/materials/oak-natural-kaplan/color.jpg
    normal: docs/materials/oak-natural-kaplan/normal.jpg
    roughness: docs/materials/oak-natural-kaplan/roughness.jpg
  tile_size_m: [1.83, 1.83]
  rotation_deg: 0
  status: assumed
  source:
    - https://polyhaven.com/a/oak_veneer_01
  notes: >-
    No front finish is written anywhere for the kitchen (kitchen-cabinets.md
    only takes IKEA METOD sizes). Assumed natural oak veneer, lacquered, so
    the kitchen reads as one piece with the oak dining run and the Kaplan
    table; it shares that texture. The vanity cabinet is "Assumed oak
    cabinet" in bathroom-1.07.yaml. The dishwasher (Bosch SBD6ECX12E) is fully
    integrated, so what shows is a kitchen front.

