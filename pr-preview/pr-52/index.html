<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Blueprints</title>
<style>
  :root {
    color-scheme: light dark;
    --bg0: #dfe7f2;
    --bg1: #f4f1ec;
    --bg2: #e8eef8;
    --fg: #1c1c1e;
    --fg-secondary: rgba(60, 60, 67, 0.7);
    --glass: rgba(255, 255, 255, 0.42);
    --glass-border: rgba(255, 255, 255, 0.55);
    --row: rgba(255, 255, 255, 0.55);
    --row-border: rgba(60, 60, 67, 0.12);
    --chevron: rgba(60, 60, 67, 0.35);
    --shadow: 0 18px 50px rgba(40, 55, 80, 0.12);
    --blur: 28px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg0: #0b1020;
      --bg1: #1c1c1e;
      --bg2: #152033;
      --fg: #f5f5f7;
      --fg-secondary: rgba(235, 235, 245, 0.58);
      --glass: rgba(44, 44, 46, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --row: rgba(58, 58, 60, 0.72);
      --row-border: rgba(84, 84, 88, 0.55);
      --chevron: rgba(235, 235, 245, 0.35);
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
    }
  }
  html, body {
    margin: 0;
    min-height: 100%;
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 80% at 10% -10%, var(--bg0), transparent 55%),
      radial-gradient(90% 70% at 100% 0%, var(--bg2), transparent 50%),
      linear-gradient(165deg, var(--bg1), var(--bg0) 55%, var(--bg2));
    background-attachment: fixed;
  }
  main {
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 1.75rem;
    width: min(26rem, 100%);
    margin: 0 auto;
    padding: calc(2rem + var(--safe-t)) 1.25rem calc(2.5rem + var(--safe-b));
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding: 0 0.15rem;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 8vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 1.05;
  }
  .tagline {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: var(--fg-secondary);
  }
  .models {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    padding: 0.65rem;
    border-radius: 22px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4);
    backdrop-filter: blur(var(--blur)) saturate(1.4);
  }
  a.web {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 3.5rem;
    padding: 0.85rem 1.1rem;
    border-radius: 14px;
    border: 1px solid var(--row-border);
    background: var(--row);
    color: var(--fg);
    text-decoration: none;
    font-size: 1.12rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  a.web:active { transform: scale(0.985); }
  a.web .chevron {
    color: var(--chevron);
    font-weight: 500;
    font-size: 1.25rem;
    line-height: 1;
  }
  .empty {
    margin: 0;
    padding: 1rem 0.5rem;
    text-align: center;
    color: var(--fg-secondary);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<main>
  <header class="brand">
    <h1>Blueprints</h1>
    <p class="tagline">3D models in the browser</p>
  </header>
  <div class="models">
    <a class="web" href="viewer/?m=obyvak">
      <span>Obyvak</span>
      <span class="chevron" aria-hidden="true">›</span>
    </a>
  </div>
</main>
</body>
</html>
