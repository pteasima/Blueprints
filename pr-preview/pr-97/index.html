<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Blueprints</title>
<style>
  /* Solid colours only. Backdrop filters, fixed backgrounds, layered
     gradients, and large shadows blank this page on iPadOS when Safari's
     GPU Process DOM Rendering is off. */
  :root {
    color-scheme: light dark;
    --bg: #f4f1ec;
    --fg: #1c1c1e;
    --muted: #5c5c60;
    --card: #ffffff;
    --line: #d2d2d7;
    --chevron: #6e6e73;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --fg: #f5f5f7;
      --muted: #a1a1a6;
      --card: #2c2c2e;
      --line: #3a3a3c;
      --chevron: #a1a1a6;
    }
  }
  html, body {
    margin: 0;
    min-height: 100%;
    color: var(--fg);
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 1.5rem;
    width: min(26rem, 100%);
    margin: 0 auto;
    padding: calc(2rem + var(--safe-t)) 1.25rem calc(2.5rem + var(--safe-b));
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .tagline {
    margin: 0;
    font-size: 1rem;
    color: var(--muted);
  }
  .models {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    overflow: hidden;
  }
  a.web {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 3.25rem;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--line);
    color: var(--fg);
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
  }
  a.web:last-child { border-bottom: 0; }
  a.web .chevron {
    color: var(--chevron);
    font-weight: 500;
    font-size: 1.25rem;
    line-height: 1;
  }
  .empty {
    margin: 0;
    padding: 1rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<main>
  <header class="brand">
    <h1>Blueprints</h1>
    <p class="tagline">3D models in the browser</p>
  </header>
  <div class="models">
    <a class="web" href="viewer/?m=obyvak">
      <span>Obyvak</span>
      <span class="chevron" aria-hidden="true">›</span>
    </a>
    <a class="web" href="viewer/?m=ground_floor">
      <span>RD Šíma 1.NP</span>
      <span class="chevron" aria-hidden="true">›</span>
    </a>
    <a class="web" href="viewer/?m=bathroom_120">
      <span>Koupelna 1.20</span>
      <span class="chevron" aria-hidden="true">›</span>
    </a>
    <a class="web" href="viewer/?m=bathroom_107">
      <span>Koupelna 1.07</span>
      <span class="chevron" aria-hidden="true">›</span>
    </a>
  </div>
  <div class="models">
    <a class="web" href="electrical/1.11.html">
      <span>1.11 Ložnice — půdorys</span>
      <span class="chevron" aria-hidden="true">›</span>
    </a>
  </div>
</main>
</body>
</html>
